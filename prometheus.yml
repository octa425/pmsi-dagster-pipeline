# ══════════════════════════════════════════════════════
# PROMETHEUS — Configuration
# Collecte les métriques de tous les services
# ══════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI — métriques applicatives
  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi:8000']
    metrics_path: '/metrics'

  # PostgreSQL — métriques base de données
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

