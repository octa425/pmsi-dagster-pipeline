name: CI/CD Pipeline PMSI Dagster

on:
  push:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer les dependances de test
        run: |
          pip install fastapi uvicorn pytest httpx \
          prometheus-fastapi-instrumentator \
          joblib scikit-learn

      - name: Lancer les tests pytest
        run: pytest test_api_prediction.py -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construire l image Docker
        run: docker build -t octa425/pmsi-dagster:latest .

      - name: Pousser sur Docker Hub
        run: docker push octa425/pmsi-dagster:latest
