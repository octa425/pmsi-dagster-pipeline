# ══════════════════════════════════════════════════════
# DOCKER-COMPOSE — Agent IA PMSI
# Orchestre : PostgreSQL + Ollama + Streamlit
#             + FastAPI + Prometheus + Grafana
# Lancement : docker-compose up -d
# ══════════════════════════════════════════════════════

version: '3.8'

services:

  # ── SERVICE 1 : PostgreSQL ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: pmsi_postgres
    environment:
      POSTGRES_DB: hopital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── SERVICE : Postgres Exporter ─────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: pmsi_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/hopital?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── SERVICE 2 : Ollama + llama3.2 ──────────────────
  ollama:
    image: ollama/ollama
    container_name: pmsi_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── SERVICE 3 : Streamlit ───────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pmsi_streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ── SERVICE 4 : FastAPI ─────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: pmsi_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── SERVICE 5 : Prometheus ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: pmsi_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ── SERVICE 6 : Grafana ─────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: pmsi_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

# ── VOLUMES PERSISTANTS ─────────────────────────────
volumes:
  postgres_data:    # Données PostgreSQL persistantes
  ollama_data:      # Modèles Ollama persistants
  prometheus_data:  # Métriques Prometheus
  grafana_data:     # Dashboards Grafana

